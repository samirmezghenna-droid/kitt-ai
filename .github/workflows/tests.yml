name: Tests
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check app.js
      - run: node --check core.js
      - run: node --check server/worker.js
